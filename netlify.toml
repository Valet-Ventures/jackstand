# Static site, no build step. Netlify serves public/ as-is:
#   public/index.html          -> /
#   public/<slug>/index.html   -> /<slug>
# Directory-index resolution is native, so no redirect rules are needed.

[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keeping demo pages out of search is handled by
# <meta name="robots" content="noindex, nofollow"> in
# templates/<vertical>/index.html, which every generated page inherits.
#
# Deliberately NOT done with a header rule here. Netlify's `for` globs treat
# `*` as a greedy splat, so a pattern intended to catch only /<slug>/ can also
# match /, which would deindex the landing page - the one page that has to
# rank. The per-page meta tag is exact and verifiable in the committed HTML.
